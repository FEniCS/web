<div class="gallery-slider-container">
  <button class="slider-btn prev-btn" onclick="scrollGallery(-1)">&#10094;</button>
  <div class="gallery-scroll-wrapper" id="gallery-scroll-wrapper">
    <div class="image-gallery" id="dynamic-image-gallery">
      <!-- Thumbnails are dynamically populated here by JS -->
    </div>
  </div>
  <button class="slider-btn next-btn" onclick="scrollGallery(1)">&#10095;</button>
</div>

<script>
  // Initialize the gallery items dynamically on page load by fetching JSON data
  document.addEventListener("DOMContentLoaded", () => {
    fetch("{{ include.data_url | relative_url }}")
      .then(response => {
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        return response.json();
      })
      .then(images => {
        const galleryContainer = document.getElementById("dynamic-image-gallery");
        if (galleryContainer) {
          galleryContainer.innerHTML = ''; // Clear fallback or placeholders
          images.forEach((itemData, index) => {
            const item = document.createElement("div");
            item.className = "gallery-item";

            const link = document.createElement("a");
            link.href = itemData.link;
            link.target = "_blank";
            link.rel = "noopener noreferrer";

            const img = document.createElement("img");
            img.src = itemData.src;
            img.loading = "lazy";
            img.alt = `Gallery Photo ${index + 1}`;

            link.appendChild(img);
            item.appendChild(link);
            galleryContainer.appendChild(item);
          });
        }
      })
      .catch(err => console.error("Error loading gallery data:", err));
  });

  function scrollGallery(direction) {
    const container = document.getElementById("gallery-scroll-wrapper");
    if (container) {
      const scrollAmount = container.clientWidth * 0.8;
      container.scrollBy({
        left: direction * scrollAmount,
        behavior: 'smooth'
      });
    }
  }
</script>
