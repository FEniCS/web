name: Build website

on:
  # Pushes to main are built by the deploy workflow, so they are skipped here.
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-hugo
        name: Install Hugo

      - run: hugo --minify --printPathWarnings --panicOnWarning
        name: Build website

      - uses: actions/upload-artifact@v7
        name: Upload the built website
        with:
          name: website
          path: public/
          retention-days: 7
