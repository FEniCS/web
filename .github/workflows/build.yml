name: Build website

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  HUGO_VERSION: 0.167.0

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        name: Install Go (needed to fetch the Hextra theme module)
        with:
          go-version: "1.27"

      - run: |
          wget -O hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i hugo.deb
        name: Install Hugo

      - run: hugo --minify --printPathWarnings --panicOnWarning
        name: Build website

      - uses: actions/upload-artifact@v7
        name: Upload the built website
        with:
          name: website
          path: public/
