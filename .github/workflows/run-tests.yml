name: Run tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  run-tests:
    name: Run tests
    runs-on: ubuntu-latest
    container: dolfinx/dolfinx:stable
    steps:
      - uses: actions/checkout@v7
      - run: pip3 install pytest flake8
        name: Install pytest and flake8
      - run: pip3 install -r tests/requirements.txt
        name: Install test dependencies
      - run: flake8 tests/
        name: Run flake8 on tests
      - run: flake8 tools/
        name: Run flake8 on tools
      - run: GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} python3 -m pytest tests/ --has-fenicsx 1
        name: Run tests
