name: Set up Hugo
description: >
  Install Hugo (extended) and the Go toolchain it uses to fetch the Hextra
  theme module. The Hugo version lives here so that the build and deploy
  workflows cannot drift apart.

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version: "1.27"

    - shell: bash
      env:
        HUGO_VERSION: 0.167.0
      run: |
        wget -O hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
        sudo dpkg -i hugo.deb
        rm hugo.deb
